start" dy="0.7em" style="opacity: 1; font-family: Arial; font-size: 28px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="88" y="36"><tspan style="font-weight:bold">Pre-claim-adjusted ARB Balance Proxy</tspan></tspan><tspan class="line" dy="1.3em" x="88" y="36"><tspan style="font-size:18px; fill:#667085">Capped proxy as a share of 1.093 billion claimed ARB at two elapsed cutoffs</tspan></tspan></text></g><g class="g-xtitle"/><g class="g-ytitle"><text class="ytitle" transform="rotate(-90,61.06875,432.5)" x="61.06875" y="432.5" text-anchor="middle" style="opacity: 1; font-family: Arial; font-size: 24px; fill: rgb(31, 41, 55); fill-opacity: 1; white-space: pre;">Share of claimed ARB</text></g><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,584.5,821)"><g class="cursor-pointer" transform="translate(125,800)"><rect class="bg" x="0.5" y="0.5" width="918" height="41" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="16" style="font-family: Arial; font-size: 16px; fill: rgb(102, 112, 133); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="16">Positive pre-claim ARB balance is removed before capping each wallet at its claim amount. This remains a transfer-derived proxy.</tspan><tspan class="line" dy="1.3em" x="2" y="16">The separate total-balance ratio can exceed 100% after additional inflow; neither metric measures human retention.</tspan></text></g></g></g></g></svg>